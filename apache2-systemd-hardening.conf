[Service]
ProtectSystem=strict
ReadWritePaths=/var/www/html /var/www/.cache /var/log/apache2 /run/apache2 /var/lib/php /var/cache/apache2
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectClock=yes
ProtectHostname=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
ProtectProc=invisible
ProcSubset=pid
PrivateMounts=yes
UMask=0027
NoNewPrivileges=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
CapabilityBoundingSet=~CAP_SYS_ADMIN CAP_SYS_PTRACE CAP_SYS_RAWIO CAP_SYS_MODULE CAP_SYS_TTY_CONFIG CAP_SYS_BOOT CAP_SYS_NICE CAP_SYS_RESOURCE CAP_SYS_PACCT CAP_SYS_CHROOT CAP_SYS_TIME CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BROADCAST CAP_AUDIT_CONTROL CAP_AUDIT_READ CAP_AUDIT_WRITE CAP_SYSLOG CAP_BPF CAP_LINUX_IMMUTABLE CAP_IPC_LOCK CAP_LEASE CAP_MKNOD CAP_WAKE_ALARM CAP_BLOCK_SUSPEND CAP_MAC_ADMIN CAP_MAC_OVERRIDE
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallArchitectures=native
SystemCallFilter=~@swap @reboot @raw-io @obsolete @mount @module @debug @cpu-emulation @clock
