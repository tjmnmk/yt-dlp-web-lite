<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html
	<Directory /var/www/html>
		Options -Indexes -FollowSymLinks
		AllowOverride All

		# HTTP basic auth
		# create users: htpasswd -c /etc/apache2/.htpasswd user1
		AuthType Basic
		AuthName "Restricted"
		AuthUserFile /etc/apache2/.htpasswd
		Require valid-user
	</Directory>

	# videos are downloaded first, then streamed — allow long requests
	Timeout 600
	# do not gzip-buffer the download progress page
	SetEnv no-gzip 1

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
